<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinManager" />
    <meta name="description" content="Personal finance management" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>FinManager</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function __reportError(ctx, msg, stack, src) {
        try {
          var body = JSON.stringify({ context: ctx, message: String(msg).slice(0, 500), stack: String(stack || "").slice(0, 2000), source: src || "", url: location.href, userAgent: navigator.userAgent });
          if (navigator.sendBeacon) { navigator.sendBeacon("/api/client-errors", new Blob([body], { type: "application/json" })); }
          else { fetch("/api/client-errors", { method: "POST", headers: { "Content-Type": "application/json" }, body: body }).catch(function(){}); }
        } catch(e) {}
      }
      window.onerror = function(msg, src, line, col, err) {
        __reportError("window.onerror", msg, err && err.stack ? err.stack : src + ":" + line + ":" + col, src);
        var d = document.getElementById("root");
        if (d) d.innerHTML = '<div style="padding:2rem;font-family:sans-serif;font-size:14px;word-break:break-all">' +
          '<h3 style="color:#dc2626">Ошибка загрузки</h3>' +
          '<p><b>' + msg + '</b></p>' +
          '<p>Файл: ' + src + ':' + line + ':' + col + '</p>' +
          '<p>' + (err && err.stack ? err.stack : '') + '</p>' +
          '<button onclick="location.reload()" style="margin-top:1rem;padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px">Перезагрузить</button></div>';
      };
      window.onunhandledrejection = function(e) {
        var reason = e.reason || {};
        __reportError("unhandledrejection", reason.message || String(e.reason), reason.stack);
        var d = document.getElementById("root");
        if (d && !d.innerHTML.includes("Ошибка")) d.innerHTML = '<div style="padding:2rem;font-family:sans-serif;font-size:14px;word-break:break-all">' +
          '<h3 style="color:#dc2626">Ошибка загрузки</h3>' +
          '<p><b>' + (reason.message || String(e.reason)) + '</b></p>' +
          '<p>' + (reason.stack || '') + '</p>' +
          '<button onclick="location.reload()" style="margin-top:1rem;padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px">Перезагрузить</button></div>';
      };
    </script>
    <script type="module" src="/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then(function (reg) {
            setInterval(function () { reg.update(); }, 60000);
          }).catch(function () {});
          navigator.serviceWorker.addEventListener("message", function (e) {
            if (e.data && e.data.type === "SW_UPDATED") {
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
